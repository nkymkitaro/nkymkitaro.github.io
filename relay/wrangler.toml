name = "mitori-relay-credentials"
main = "worker.js"
compatibility_date = "2024-11-01"
# 鍵は、ここに書かない。次の2つを「wrangler secret put」で入れる(relay/README.md)
#   TURN_KEY_ID
#   TURN_KEY_API_TOKEN

# 回数の制限(2026-11-16): 1つのアクセス元から60秒に30回まで(worker.js の ISSUE_LIMITER)。wrangler 4.36 以上が要る
[[ratelimits]]
name = "ISSUE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
