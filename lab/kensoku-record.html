<!DOCTYPE html>
<html lang="ja" data-lab>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- 試作: ケンソク！の記録(日々の記録・伸びのグラフ・目標)。仕様 claude/specs/kensoku-log-spec.md(中山さん 2026-11-23)。
     記録は端末の中だけ(localStorage)。計測の出来事(GA4)は送らない。通常のページからリンクしない(ケンソク！の⚙から開く) -->
<title>ケンソク！の記録(MITORI 試作)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Murecho:wght@500;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&text=%E3%82%B1%E3%83%B3%E3%82%BD%E3%82%AF&display=block" rel="stylesheet">
<style>
  /* 白地。色は MITORI と同じ紺・白・赤だけ(赤は自己ベスト・達成・最高の点)。箱で囲まず、見出しは斜めの帯(撮影画面の LIVE の帯と同じ形) */
  :root { color-scheme: light; --paper: #fff; --ink: #0c1636; --n800: #14224d; --n700: #1d3170; --shade: #2c4aa0; --red: #d6231b; --soft: #4a5478; --rule: #dfe3ee; --tint: #eef1f8; --skew: -14deg; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Murecho", -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font-family: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; }
  /* 上の段: 紺の帯にロゴ(ケンソク！の画面と同じ) */
  .head { background: var(--ink); color: #fff; padding-top: env(safe-area-inset-top); }
  .top { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px 12px; }
  .ib { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85); background: transparent; color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .ib svg { width: 24px; height: 24px; }
  .kslogo { height: 38px; width: auto; display: block; overflow: visible; }
  .ttl { font-weight: 900; font-size: 1.15rem; padding: 6px 22px 6px 12px; background: #fff; color: var(--ink); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  /* 区切りの見出し: 紺の斜めの帯 */
  .sec { margin-top: 26px; }
  .sec > h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1rem; font-weight: 900; }
  .sec > h2 .lb { display: inline-block; background: var(--ink); color: #fff; padding: 5px 20px 5px 10px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); letter-spacing: .04em; }
  .sec > h2 .sub { font-size: .85rem; font-weight: 800; color: var(--soft); }
  .sec > h2 .sp { flex: 1; }
  /* 今日: 大きな数字を3つ。区切りは縦の細い線 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stats > div { padding: 2px 10px 4px; border-left: 2px solid var(--rule); min-width: 0; }
  .stats > div:first-child { border-left: 0; padding-left: 0; }
  .stats .k { font-size: .85rem; font-weight: 800; color: var(--soft); }
  .stats .v { font-size: 2.6rem; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .stats .u { font-size: .85rem; font-weight: 800; color: var(--soft); }
  .stats .best .v { color: var(--red); }
  .pb { display: inline-block; white-space: nowrap; margin-top: 2px; font-size: .82rem; font-weight: 900; color: #fff; padding: 3px 14px 3px 8px; background: var(--red); clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  /* 続けた日数: 直近7日の稽古の印 */
  .streak { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding: 12px 0 0; border-top: 2px solid var(--ink); font-weight: 800; flex-wrap: wrap; }
  .streak > span:first-child { white-space: nowrap; }
  .streak b { font-size: 1.6rem; font-weight: 900; font-variant-numeric: tabular-nums; margin-right: 2px; }
  .week7 { display: flex; gap: 4px; }
  .week7 span { width: 26px; text-align: center; font-size: .82rem; font-weight: 800; color: var(--soft); }
  .week7 i { display: block; width: 26px; height: 26px; margin-bottom: 2px; background: var(--tint); transform: skewX(var(--skew)); }
  .week7 .on i { background: var(--ink); }
  .week7 .today i { outline: 2px solid var(--red); outline-offset: 1px; }
  /* 目標 */
  .goal { display: grid; gap: 6px; margin-top: 12px; }
  .goal .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; font-size: .95rem; }
  .goal .row .n { font-variant-numeric: tabular-nums; text-align: right; }
  .goal .row .done { display: inline-block; color: #fff; background: var(--red); font-size: .82rem; padding: 2px 12px 2px 7px; margin-left: 6px; clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 100%, 0 100%); }
  .bar { height: 14px; background: var(--tint); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .4s; }
  .bar.ok i { background: var(--red); }
  .note { font-size: .85rem; color: var(--soft); line-height: 1.7; }
  .btn { min-height: 48px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; color: var(--ink); font-size: .95rem; font-weight: 800; padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .btn:active { transform: translateY(2px); }
  .btn.main { background: var(--ink); color: #fff; box-shadow: 0 4px 0 var(--shade); }
  .btn.sm { min-height: 44px; font-size: .85rem; padding: 0 12px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; }
  button:focus-visible, a:focus-visible, label:focus-visible { outline: 3px solid var(--shade); outline-offset: 2px; }
  /* 切り替え(斜めの帯。選んだものは紺、影は明るい紺) */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { position: relative; z-index: 0; border: 0; background: transparent; color: var(--soft); font-weight: 900; font-size: .95rem; padding: 10px 14px; min-height: 48px; cursor: pointer; white-space: nowrap; }
  .tabs button::before, .tabs button::after { content: ''; position: absolute; inset: 6px 0; transform: skewX(var(--skew)); z-index: -1; }
  .tabs button::before { background: var(--tint); }
  .tabs button.on { color: #fff; }
  .tabs button.on::before { background: var(--ink); }
  .tabs button.on::after { background: var(--shade); transform: skewX(var(--skew)) translate(4px, 4px); z-index: -2; }
  .tools { margin-top: 16px; }
  #chart { display: block; width: 100%; height: auto; margin-top: 8px; }
  .legend { display: flex; gap: 14px; font-size: .85rem; font-weight: 800; color: var(--soft); margin-top: 4px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: .85rem; font-weight: 800; color: var(--soft); text-align: right; padding: 6px 4px; border-bottom: 2px solid var(--ink); }
  td { font-size: 1rem; font-weight: 800; text-align: right; padding: 11px 4px; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; }
  td .old { display: block; font-size: .82rem; color: var(--soft); font-weight: 500; }
  td.pbv { color: var(--red); }
  .empty { text-align: center; padding: 40px 10px; line-height: 1.8; font-weight: 800; }
  #msg { min-height: 1.4em; margin-top: 8px; }
  input[type=file] { display: none; }
  /* 目標を決める板(下から) */
  .ov { position: fixed; inset: 0; background: rgba(12,22,54,.45); display: none; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 560px; margin: 0 auto; background: #fff; border-top: 4px solid var(--ink); padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); transform: translateY(105%); visibility: hidden; transition: transform .25s, visibility 0s .25s; box-shadow: 0 -8px 30px rgba(12,22,54,.2); }
  body.sheet-on .ov { display: block; } body.sheet-on .sheet { transform: none; visibility: visible; transition: transform .25s; }
  .sheet h3 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 900; }
  .stp { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--rule); }
  .stp .lb { font-weight: 800; }
  .stp .ctl { display: flex; align-items: center; gap: 8px; }
  .stp .val { min-width: 5.5em; text-align: center; font-weight: 900; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .stp .ib { border-color: var(--ink); color: var(--ink); font-size: 1.4rem; font-weight: 900; }
  @media (max-width: 370px) { .stats .v { font-size: 2.15rem; } .week7 span, .week7 i { width: 22px; } .week7 i { height: 22px; } }
  @media (prefers-reduced-motion: reduce) { .bar i, .sheet { transition: none; } }
</style>
</head>
<body>
<div class="head"><header class="top">
    <a class="ib" href="speedometer.html" aria-label="ケンソク！に戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <svg class="kslogo" viewBox="14 4 252 80" role="img" aria-label="ケンソク！"><g transform="skewX(-8)"><text x="22" y="70" font-family="Reggae One" font-size="54" letter-spacing="-5" fill="#fff">ケンソク</text><path d="M250 10 L260 10 L254 58 L248 58 Z" fill="#e0353b"/><circle cx="250" cy="72" r="6.5" fill="#e0353b"/></g></svg>
    <span class="ttl">記録</span>
  </header></div>
<div class="wrap">

  <div id="demoNote" class="note" style="display:none;margin-top:12px">見本の記録です。ボタンは試せますが、この端末には残りません。</div>
  <div id="main"></div>

  <section class="sec">
    <h2><span class="lb">記録の持ち運び</span></h2>
    <p class="note" style="margin:0 0 10px">記録はこの端末の中だけにあります。機種変更やブラウザのデータを消す前に、書き出しておくと戻せます。</p>
    <div class="btns">
      <button class="btn sm" id="btnBackup" type="button">バックアップを書き出す</button>
      <label class="btn sm" for="fileIn">バックアップを読み込む</label><input id="fileIn" type="file" accept="application/json,.json">
      <button class="btn sm" id="btnClear" type="button">記録を消す</button>
    </div>
    <div class="note" id="msg" role="status" aria-live="polite"></div>
  </section>
</div>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTtl">
  <h3 id="sheetTtl">目標を決める</h3>
  <div class="stp">
    <span class="lb">1日の本数</span>
    <span class="ctl"><button class="ib" type="button" data-g="count" data-d="-10" aria-label="10本へらす">−</button><span class="val" id="gCount"></span><button class="ib" type="button" data-g="count" data-d="10" aria-label="10本ふやす">＋</button></span>
  </div>
  <div class="stp">
    <span class="lb">平均の速さ</span>
    <span class="ctl"><button class="ib" type="button" data-g="avg" data-d="-0.5" aria-label="0.5へらす">−</button><span class="val" id="gAvg"></span><button class="ib" type="button" data-g="avg" data-d="0.5" aria-label="0.5ふやす">＋</button></span>
  </div>
  <div class="btns" style="margin-top:14px; justify-content:flex-end">
    <button class="btn sm" id="gNone" type="button">目標なし</button>
    <button class="btn main" id="gOk" type="button">決める</button>
  </div>
</div>

<script type="module">
import * as K from './js/kensoku-log.js';

const $ = (id) => document.getElementById(id);
// ?demo=1: 見本の記録で見た目を確かめる(端末の記録は読まず、書きもしない。中山さん 2026-11-23「モックページ作って」)
const DEMO = new URLSearchParams(location.search).has('demo');
const mem = {};
const read = (k, d) => { if (DEMO) return k in mem ? JSON.parse(mem[k]) : d; try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const write = (k, v) => { if (DEMO) { mem[k] = JSON.stringify(v); return true; } try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
if (DEMO) { // 見本: 40日ぶん。竹刀が主で木刀が少し。少しずつ速くなる。ところどころ休み。いちばん古い5日は「古い測り方」
  const log = []; let r = 7; const rnd = () => { r = (r * 16807) % 2147483647; return r / 2147483647; };
  const now = Date.now(); const MS = 86400000;
  for (let d = 40; d >= 0; d--) {
    if (d % 6 === 3 || d === 1) continue;
    const n = d === 0 ? 64 : 60 + Math.round(rnd() * 60);
    for (let i = 0; i < n; i++) {
      const t = new Date(now - d * MS - (n - i) * 20000);
      const bokuto = i % 5 === 0;
      const v = (bokuto ? 12.2 : 11.4) + rnd() * 4.2 - d * 0.045 + (d === 0 ? 0.8 : 0) + (d >= 36 ? 2.5 : 0);
      log.push({ at: t.toISOString(), tool: bokuto ? '木刀(形の大刀)' : '竹刀 一般 120', tip: +v.toFixed(2), mono: +(v * 0.72).toFixed(2), hand: 3.1, ...(d >= 36 ? {} : { m: 'hit60' }) });
    }
  }
  mem[K.LOG_KEY] = JSON.stringify(log); mem[K.GOAL_KEY] = JSON.stringify({ count: 100, avg: 13 });
}
const f1 = (x) => (x == null ? '--' : x.toFixed(1));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let log = read(K.LOG_KEY, []);
let days = K.mergeDays(read(K.DAYS_KEY, {}), K.summarize(log));
write(K.DAYS_KEY, days); // 開くたびに日ごとのまとめを残す(1本ごとの記録は5,000本で古いものから消えるため)
let goal = read(K.GOAL_KEY, { count: null, avg: null });
let tool = null; let span = 'day';
try { tool = localStorage.getItem('mitori.kensoku.tool'); span = localStorage.getItem('mitori.kensoku.span') || 'day'; } catch (e) { /* そのまま */ }

function render() {
  const today = K.dayOf(Date.now());
  const ts = K.tools(days);
  if (!ts.includes(tool)) tool = ts[0] || null;
  const hasAny = Object.keys(days).length > 0;
  if (!hasAny) {
    $('main').innerHTML = `<section class="sec empty">まだ記録がありません。<br>ケンソク！で振ると、<br>ここに日ごとに残ります。<div style="margin-top:14px"><a class="btn main" href="speedometer.html">ケンソク！へ</a></div></section>`;
    return;
  }
  const list = tool ? K.daysFor(days, tool) : [];
  const t = list.find((s) => s.d === today);
  const tAvg = t ? t.sum / t.n : null; const tBest = t ? t.best : null;
  const before = tool ? K.bestBefore(days, tool, today) : 0;
  const pb = t && before > 0 && tBest > before;
  const nToday = K.countOn(days, today);
  const st = K.streak(days, today);

  let h = '';
  // 道具の切り替え(2つ以上あるときだけ)
  if (ts.length > 1) h += `<div class="tabs tools" role="tablist" aria-label="道具">${ts.map((x) => `<button type="button" role="tab" data-tool="${esc(x)}" class="${x === tool ? 'on' : ''}" aria-selected="${x === tool}">${esc(x)}</button>`).join('')}</div>`;
  // 今日
  // 直近7日の稽古の印(振った日=紺。今日は赤の枠)
  const w7 = []; for (let i = 6; i >= 0; i--) { const x = new Date(`${today}T12:00:00`); x.setDate(x.getDate() - i); const d = K.dayOf(x); w7.push(`<span class="${K.countOn(days, d) > 0 ? 'on' : ''}${i === 0 ? ' today' : ''}"><i></i>${'日月火水木金土'[x.getDay()]}</span>`); }
  h += `<section class="sec"><h2><span class="lb">今日</span>${tool ? `<span class="sub">${esc(tool)}</span>` : ''}</h2><div class="stats">
    <div><div class="k">本数</div><div class="v">${t ? t.n : 0}</div><span class="u">本</span></div>
    <div><div class="k">平均</div><div class="v">${f1(tAvg)}</div><span class="u">m/秒</span></div>
    <div class="${pb ? 'best' : ''}"><div class="k">最高</div><div class="v">${f1(tBest)}</div>${pb ? '<span class="pb">自己ベスト</span>' : '<span class="u">m/秒</span>'}</div></div>
    <div class="streak"><span>${st > 0 ? `<b>${st}</b>日 続けています` : '今日はまだ振っていません'}</span><span class="week7" aria-label="直近7日に振った日">${w7.join('')}</span></div></section>`;
  // 目標
  h += '<section class="sec"><h2><span class="lb">目標</span><span class="sp"></span><button class="btn sm" id="btnGoal" type="button">目標を決める</button></h2>';
  if (!goal.count && !goal.avg) h += '<p class="note" style="margin:0">「1日の本数」と「平均の速さ」を決められます。</p>';
  if (goal.count) { const r = Math.min(1, nToday / goal.count); const ok = nToday >= goal.count; h += `<div class="goal"><div class="row"><span>1日の本数</span><span class="n">${nToday} / ${goal.count}本${ok ? '<span class="done">達成</span>' : ''}</span></div><div class="bar${ok ? ' ok' : ''}"><i style="width:${(r * 100).toFixed(0)}%"></i></div></div>`; }
  if (goal.avg) {
    const enough = t && t.n >= K.AVG_MIN_N; const ok = enough && tAvg >= goal.avg; const r = enough ? Math.min(1, tAvg / goal.avg) : 0;
    h += `<div class="goal"><div class="row"><span>平均の速さ</span><span class="n">${enough ? f1(tAvg) : `${t ? t.n : 0}本 / ${K.AVG_MIN_N}本から`} / ${goal.avg.toFixed(1)} m/秒${ok ? '<span class="done">達成</span>' : ''}</span></div><div class="bar${ok ? ' ok' : ''}"><i style="width:${(r * 100).toFixed(0)}%"></i></div></div>`;
  }
  h += '</section>';
  // 伸びのグラフ
  h += `<section class="sec"><h2><span class="lb">伸び</span></h2><div class="tabs" role="tablist" aria-label="グラフの区切り"><button type="button" role="tab" data-span="day" class="${span === 'day' ? 'on' : ''}" aria-selected="${span === 'day'}">日ごと(14日)</button><button type="button" role="tab" data-span="week" class="${span === 'week' ? 'on' : ''}" aria-selected="${span === 'week'}">週ごと(12週)</button></div>
    <svg id="chart" role="img" aria-label="平均と最高の推移"></svg>
    <div class="legend"><span><i style="background:var(--n700)"></i>平均</span><span><i style="background:var(--red);border-radius:50%"></i>最高</span>${goal.avg ? '<span><i style="background:none;border-top:2px dashed var(--ink);height:0;vertical-align:3px"></i>目標の平均</span>' : ''}</div></section>`;
  // 日ごとの一覧
  const all = Object.values(days).filter((s) => (tool ? s.tool === tool : true)).sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : a.old - b.old));
  const oldOnly = Object.values(days).some((s) => s.old);
  h += `<section class="sec"><h2><span class="lb">日ごと</span></h2><table><thead><tr><th>日付</th><th>本数</th><th>平均</th><th>最高</th></tr></thead><tbody>${all.map((s) => {
    const dd = new Date(`${s.d}T12:00:00`); const wk = '日月火水木金土'[dd.getDay()];
    const isPb = !s.old && s.best > 0 && s.best >= Math.max(...list.map((x) => x.best));
    return `<tr><td>${dd.getMonth() + 1}/${dd.getDate()}(${wk})${s.old ? '<span class="old">古い測り方</span>' : ''}</td><td>${s.n}</td><td>${(s.sum / s.n).toFixed(1)}</td><td class="${isPb ? 'pbv' : ''}">${s.best.toFixed(1)}</td></tr>`;
  }).join('')}</tbody></table>${oldOnly ? '<p class="note" style="margin:10px 0 0">「古い測り方」は、11/23 15時より前の記録です(いちばん速い瞬間で測っていたので、数字が高めに出ます)。グラフ・自己ベスト・目標には入れていません。</p>' : ''}</section>`;

  $('main').innerHTML = h;
  drawChart(span === 'day' ? K.lastDays(days, tool, today, 14) : K.lastWeeks(days, tool, today, 12));
  $('main').querySelectorAll('[data-tool]').forEach((b) => { b.onclick = () => { tool = b.dataset.tool; try { localStorage.setItem('mitori.kensoku.tool', tool); } catch (e) { /* そのまま */ } render(); }; });
  $('main').querySelectorAll('[data-span]').forEach((b) => { b.onclick = () => { span = b.dataset.span; try { localStorage.setItem('mitori.kensoku.span', span); } catch (e) { /* そのまま */ } render(); }; });
  $('btnGoal').onclick = openSheet;
}

// 棒=平均、点=最高、点線=目標の平均。振らなかった日は空ける
function drawChart(pts) {
  const svg = $('chart'); const W = Math.round(svg.getBoundingClientRect().width) || 520; const H = 240; const L = 30; const R = 6; const T = 22; const B = 30; // 画面の幅そのままで描く(文字を13px以上に保つため)
  const vals = pts.flatMap((p) => [p.avg, p.best]).filter((x) => x != null).concat(goal.avg ? [goal.avg] : []);
  const top = Math.max(10, Math.ceil((Math.max(0, ...vals) * 1.12) / 2) * 2);
  const y = (v) => T + (H - T - B) * (1 - v / top); const bw = (W - L - R) / pts.length;
  let s = '';
  for (let v = 0; v <= top; v += top > 20 ? 5 : 2) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#dfe3ee"/><text x="${L - 5}" y="${y(v) + 4}" text-anchor="end" font-size="13" fill="#4a5478">${v}</text>`;
  const every = Math.max(1, Math.ceil(pts.length * 46 / (W - L - R))); // 日付の文字が重ならない間隔
  pts.forEach((p, i) => {
    const cx = L + bw * (i + 0.5);
    if (p.avg != null) {
      s += `<rect x="${cx - bw * 0.32}" y="${y(p.avg)}" width="${bw * 0.64}" height="${y(0) - y(p.avg)}" fill="#1d3170"/>`;
      if (i === pts.length - 1 || (W - L - R) / pts.length >= 34) s += `<text x="${cx}" y="${y(Math.max(p.avg, p.best || 0)) - 7}" text-anchor="middle" font-size="13" font-weight="800" fill="#0c1636">${p.avg.toFixed(1)}</text>`;
    }
    if (p.best != null) s += `<circle cx="${cx}" cy="${y(p.best)}" r="4.5" fill="#d6231b" stroke="#fff" stroke-width="2"/>`;
    if ((pts.length - 1 - i) % every === 0) s += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="13" fill="#4a5478">${p.label.replace('〜', '')}</text>`;
  });
  if (goal.avg) s += `<line x1="${L}" x2="${W - R}" y1="${y(goal.avg)}" y2="${y(goal.avg)}" stroke="#0c1636" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  if (!pts.some((p) => p.avg != null)) s += `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="14" font-weight="800" fill="#4a5478">この期間の記録はありません</text>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = s;
}

// ---- 目標を決める ----
let draft = { count: null, avg: null };
const showDraft = () => { $('gCount').textContent = draft.count ? `${draft.count}本` : 'なし'; $('gAvg').textContent = draft.avg ? `${draft.avg.toFixed(1)} m/秒` : 'なし'; };
function openSheet() {
  draft = { ...goal };
  document.body.classList.add('sheet-on'); showDraft();
}
const closeSheet = () => document.body.classList.remove('sheet-on');
$('ov').onclick = closeSheet;
document.querySelectorAll('[data-g]').forEach((b) => { b.onclick = () => {
  const g = b.dataset.g; const d = Number(b.dataset.d);
  if (g === 'count') { const v = (draft.count || (d > 0 ? 90 : 0)) + d; draft.count = v >= 10 ? Math.min(2000, v) : null; }
  else { let base = draft.avg; if (!base) { const tl = tool ? K.daysFor(days, tool) : []; const recent = tl.slice(0, 7); const n = recent.reduce((m, s) => m + s.n, 0); base = n ? Math.round((recent.reduce((m, s) => m + s.sum, 0) / n) * 2) / 2 : 12; base -= d; } const v = Math.round((base + d) * 2) / 2; draft.avg = v >= 1 ? Math.min(40, v) : null; }
  showDraft();
}; });
$('gNone').onclick = () => { goal = { count: null, avg: null }; write(K.GOAL_KEY, goal); closeSheet(); render(); };
$('gOk').onclick = () => { goal = { ...draft }; write(K.GOAL_KEY, goal); closeSheet(); render(); };

// ---- バックアップ ----
const msg = (t) => { $('msg').textContent = t; };
$('btnBackup').onclick = () => {
  const b = K.makeBackup(log, days, goal);
  const url = URL.createObjectURL(new Blob([JSON.stringify(b)], { type: 'application/json' })); const a = document.createElement('a');
  a.href = url; a.download = `kensoku-backup-${K.dayOf(Date.now())}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  msg(`書き出しました(${log.length}本・${new Set(Object.values(days).map((s) => s.d)).size}日ぶん)。`);
};
$('fileIn').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const r = K.mergeBackup({ log, days, goal }, JSON.parse(await f.text()));
    log = r.log.slice(-5000); days = r.days; goal = r.goal;
    write(K.LOG_KEY, log); write(K.DAYS_KEY, days); write(K.GOAL_KEY, goal);
    msg(r.added ? `読み込みました(${r.added}本を足しました)。` : '読み込みました(新しい記録はありませんでした)。'); render();
  } catch (err) { msg(err && err.message === 'ケンソク！のバックアップではありません' ? err.message : '読み込めませんでした。ケンソク！で書き出したファイルを選んでください。'); }
};
let clearArm = 0;
$('btnClear').onclick = () => { // 2回押しで消す(1回目は知らせるだけ)
  if (Date.now() - clearArm > 3000) { clearArm = Date.now(); msg('もう一度押すと、この端末の記録をすべて消します(目標は残します)。'); return; }
  clearArm = 0; log = []; days = {}; write(K.LOG_KEY, log); write(K.DAYS_KEY, days); msg('記録を消しました。'); render();
};

if (DEMO) $('demoNote').style.display = 'block';
render();
// ケンソク！から戻ったとき(別のタブで振ったときも)に、最新にする
let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });
window.addEventListener('pageshow', () => { log = read(K.LOG_KEY, []); days = K.mergeDays(read(K.DAYS_KEY, {}), K.summarize(log)); write(K.DAYS_KEY, days); render(); });
window.__kensoku = { K, get days() { return days; } }; // 試験用
</script>
</body>
</html>
