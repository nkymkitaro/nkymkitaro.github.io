<!DOCTYPE html>
<html lang="ja" data-lab>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- 試作: 素振りのスピードメーター(リアルタイム)。道具は毎コマ、骨格は1秒10回ほど(別の処理)。表示は3案(メーター・数字・映像)を切り替えて見比べる。
     見た目は MITORI の撮影画面にそろえる(紺・白・赤、斜めの帯、白い細い縁の丸ボタン、Murecho。中山さん 2026-11-22)。速さは読み上げもできる(遠くからでも分かるように。奥さまの案)
     映像は端末の中だけで扱い、保存も送信もしない。計測の出来事(GA4)は送らない。通常のページからリンクしない -->
<title>ケンソク！(MITORI 試作)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Murecho:wght@500;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&text=%E3%82%B1%E3%83%B3%E3%82%BD%E3%82%AF&display=block" rel="stylesheet"><!-- ロゴの4文字だけ読む -->
<style>
  :root { --n950: #070d22; --n900: #0c1636; --n800: #14224d; --n700: #1d3170; --line: rgba(255,255,255,.2); --shade: #2c4aa0; --red: #d6231b; --text: #fff; --soft: rgba(255,255,255,.62); --skew: -14deg; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--n950); color: var(--text); font-family: "Murecho", -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); overflow: hidden; }
  button, select { font-family: inherit; }
  /* 上の段: ロゴ・状態の帯・丸ボタン */
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px; }
  .top .logo { height: 22px; opacity: .9; }
  .band { display: inline-flex; align-items: center; gap: 8px; padding: 6px 22px 6px 12px; font-weight: 900; font-size: 1.05rem; line-height: 1; letter-spacing: .04em; white-space: nowrap; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); background: var(--n700); }
  .band[data-state="on"] { background: var(--red); }
  .band[data-state="idle"] { background: none; clip-path: none; padding: 0 4px; }
  .kslogo { height: 44px; width: auto; display: block; overflow: visible; }
  .band[data-state="on"]::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .sp { flex: 1; }
  .ib { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85); background: rgba(12,22,54,.9); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; list-style: none; }
  .ib svg { width: 24px; height: 24px; }
  .ib.off { opacity: .45; }
  details.set { position: relative; }
  details.set summary::-webkit-details-marker { display: none; }
  details.set .setp { position: absolute; z-index: 20; top: 56px; right: 0; width: min(86vw, 340px); max-height: 70vh; overflow: auto; background: var(--n900); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .setp h4 { margin: 4px 0 0; font-size: .8rem; color: var(--soft); font-weight: 800; }
  .setp label { display: grid; grid-template-columns: 6.5em 1fr; align-items: center; gap: 8px; font-size: .9rem; font-weight: 800; }
  .setp select, .setp .btn, .file { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--n800); color: #fff; font-size: .95rem; font-weight: 800; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .setp .row { display: flex; flex-wrap: wrap; gap: 8px; }
  input[type=file] { display: none; }
  #logInfo { font-size: .8rem; color: var(--soft); }
  #stat:empty { display: none; }
  #stat { font-size: .72rem; color: var(--soft); padding: 0 14px 4px; font-variant-numeric: tabular-nums; min-height: 1.2em; }
  /* 真ん中: 映像と表示 */
  main { flex: 1; position: relative; overflow: hidden; display: flex; min-height: 0; }
  .stage { position: relative; background: #000; }
  .stage video { display: block; width: 100%; height: 100%; object-fit: contain; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .view { flex: 1; position: relative; min-height: 0; }
  .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  body.ui-a .stage, body.ui-b .stage { width: 34%; min-width: 160px; }
  body.ui-c .stage { flex: 1; }
  body.ui-c .view { display: none; }
  @media (orientation: portrait) {
    main { flex-direction: column; }
    /* 縦向きも映像を画面いっぱいに。メーターは下半分に半透明で重ねる(2026-11-24 実機: 映像が細い帯になっていた) */
    body.ui-a .stage, body.ui-b .stage { position: absolute; inset: 0; width: auto; height: auto; margin: 0; border-radius: 0; }
    body.ui-a .view, body.ui-b .view { flex: none; height: 50%; margin-top: auto; z-index: 3; pointer-events: none; background: linear-gradient(to top, rgba(7,13,34,.85) 55%, rgba(7,13,34,0)); }
  }
  .big { position: absolute; left: 14px; top: 12px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,.8); display: none; }
  body.ui-c .big { display: block; }
  .big .tag { display: inline-block; background: #fff; color: var(--n900); font-size: 1rem; padding: 4px 16px 4px 10px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .big .n { display: block; font-size: 96px; line-height: 1; } .big .u { font-size: 22px; margin-left: 4px; } .big .s { display: block; font-size: 15px; color: #eee; white-space: pre-line; }
  /* 注意の一言: 数字を隠さないよう映像の上に小さく。赤ベタにしない(2026-11-24 中山さん「警告は鬱陶しい」) */
  #coach { cursor: pointer; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 20px); z-index: 5; display: none; align-items: center; gap: 8px; background: rgba(7,13,34,.8); color: #fff; border-radius: 999px; font-size: .98rem; font-weight: 800; line-height: 1.4; padding: 8px 16px 8px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  #coach::before { content: ''; flex: none; width: 10px; height: 10px; border-radius: 50%; background: #ffb020; }
  .help .steps { text-align: left; margin: 0; padding-left: 1.6em; line-height: 1.7; }
  .help .steps li { margin: 6px 0; }
  .help .steps b { color: #fff; border-bottom: 2px solid #d6343a; }
  .help { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1rem; font-weight: 800; line-height: 1.8; padding: 16px; background: rgba(7,13,34,.55); }
  /* 下の段: 表示の切り替え(名前の帯)と、はじめる・とめる */
  .dock { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--n900); }
  .tabs { display: flex; gap: 6px; }
  .tabs button { white-space: nowrap; }
  @media (max-width: 380px) { .dock { padding-left: 10px; padding-right: 10px; gap: 4px; } .tabs { gap: 0; } .tabs button { padding: 12px 8px; font-size: .9rem; } .go { min-width: 100px; } }
  .tabs button { position: relative; border: 0; background: transparent; color: var(--soft); font-weight: 900; font-size: 1rem; padding: 12px 14px; min-height: 48px; cursor: pointer; }
  .tabs button::before, .tabs button::after { content: ''; position: absolute; inset: 4px 0; transform: skewX(var(--skew)); z-index: -1; }
  .tabs button { z-index: 0; }
  .tabs button.on { color: var(--n900); }
  .tabs button.on::after { background: var(--shade); transform: skewX(var(--skew)) translate(4px, 4px); z-index: -2; }
  .tabs button.on::before { background: #fff; }
  .go { min-width: 120px; min-height: 64px; border-radius: 18px; border: 0; background: #fff; color: var(--n900); font-weight: 900; font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 0 var(--shade); }
  .go.stop { background: var(--red); color: #fff; box-shadow: 0 4px 0 #7a1410; }
  .go svg { width: 22px; height: 22px; }
  /* 横向き: 左に映像(上から下まで)、右の列に ロゴ・状態・メーター・切り替え・はじめる(2026-11-23 実機「横画面クソすぎ」: 映像もメーターも小さく、上下の段で高さを取られていた) */
  @media (orientation: landscape) {
    body { --rc: clamp(300px, 36vw, 420px); display: grid; grid-template-columns: minmax(0, 1fr) var(--rc); grid-template-rows: auto auto minmax(0, 1fr) auto; }
    main { display: contents; }
    .stage { grid-column: 1 / -1; grid-row: 1 / -1; width: auto !important; min-width: 0 !important; } /* 横向き: 映像は画面いっぱい。右の列(メーター・ボタン)は映像の上に重ねる(2026-11-24 中山さん「メーターは半透明で、盛り上げる役割」) */
    .top { grid-column: 2; grid-row: 1; padding: 8px 10px 2px; gap: 6px; }
    .top .logo { height: 16px; }
    .kslogo { height: 34px; }
    .band { font-size: .95rem; padding: 5px 18px 5px 10px; }
    .ib { width: 42px; height: 42px; } .ib svg { width: 21px; height: 21px; }
    #stat { grid-column: 1; grid-row: 1; z-index: 3; align-self: start; font-size: .62rem; padding: 4px 8px; margin: 6px; border-radius: 8px; background: rgba(7,13,34,.6); pointer-events: none; } /* 映像の上に小さく重ねる(右の列はメーターに使う) */
    .view { grid-row: 2 / 4 !important; }
    .view { grid-column: 2; z-index: 3; pointer-events: none; }
    .stage video { object-position: left center; } /* 映像は左に寄せ、余った黒は右(メーターの下)へ。左に黒い帯を作らない */
    .view canvas { opacity: .9; }
    .dock { grid-column: 2; grid-row: 4; padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); background: none; }
    .dock { gap: 6px; } .tabs { gap: 2px; } .tabs button { font-size: .92rem; padding: 10px 11px; min-height: 44px; white-space: nowrap; }
    .go { flex: none; min-width: 84px; min-height: 52px; font-size: 1rem; padding: 0 10px; }
    .top, .dock { position: relative; z-index: 4; }
    body.ui-c .stage { grid-column: 1 / -1; } /* 映像: 画面いっぱいに映像。右の列のボタンは映像の上に重ねる */
    body.ui-c #stat { grid-row: 4; align-self: end; }
    #coach { position: fixed; top: 12px; left: calc((100vw - var(--rc)) / 2); }
  }

  /* 準備の案内(2026-11-24 中山さん「画面全体を大きく使い、スマホセット→構え→素振り開始を気持ちよく」): 準備中は映像を画面いっぱいに */
  body.prep .view { display: none; }
  body.prep .stage, body.prep.ui-a .stage, body.prep.ui-b .stage { flex: 1; width: auto; height: auto; margin: 0; border-radius: 0; }
  .prepov { position: absolute; inset: 0; z-index: 3; display: none; pointer-events: none; }
  /* 準備(2026-11-24 中山さん「センサーの効率でなく、ユーザーの体験を」): チェック表を見せず、「ここに立つ」人の影と、やることを一言だけ */
  .pmsg { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); text-align: center; font-size: 1.3rem; font-weight: 900; line-height: 1.4; padding: 10px 22px; border-radius: 999px; background: rgba(7,13,34,.72); transition: background .3s; }
  .ghost { position: absolute; left: 50%; top: 50%; height: 64%; transform: translate(-50%, -46%); overflow: visible; }
  .ghost g { stroke: rgba(255,255,255,.8); stroke-width: 4; stroke-dasharray: 7 6; filter: drop-shadow(0 0 3px rgba(0,0,0,.8)); transition: stroke .3s; }
  .ghost .gs { stroke: rgba(255,120,110,.9); }
  .prepov.ok .ghost g { stroke: #fff; stroke-dasharray: none; stroke-width: 5; animation: gl .9s ease-out; }
  .prepov.ok .pmsg { background: var(--red); }
  @keyframes gl { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .ghost g { transform-origin: 60px 100px; }
  .pskip { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); pointer-events: auto; min-height: 44px; padding: 0 16px; background: none; border: 0; color: rgba(255,255,255,.85); font-weight: 800; font-size: .95rem; text-decoration: underline; text-underline-offset: 4px; text-shadow: 0 1px 4px #000; cursor: pointer; }
  .prepov.ok .pskip { display: none; }
  .pmsg { text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; } /* 区切り(、。)で折り返す */
  body.popping .view, body.ready .view { opacity: .12; transition: opacity .2s; } /* 数字が弾ける間・合図の間は、メーターを引っ込めて主役を一つに */
  .view { transition: opacity .4s; }
  @media (orientation: landscape) {
    .prepov { right: var(--rc); } .ghost { height: 70%; }
    /* 横向きの準備: 空いている右の列に、やることを大きく出す(映像の上は人の影だけ) */
    .pmsg { position: fixed; left: auto !important; right: 0; top: 50%; transform: translateY(-60%); width: var(--rc); max-width: none; padding: 0 22px; background: none !important; font-size: 1.6rem; line-height: 1.45; text-align: center; }
    .prepov.ok .pmsg { color: #fff; font-size: 2.4rem; }
    .savebtn { right: calc(var(--rc) + 16px) !important; }
    body.prep .help { padding-bottom: 76px; }
  }
  /* 1本ごとに数字を大きく弾けさせる(盛り上げ) */
  .pop { position: absolute; left: 0; right: 0; top: 30%; z-index: 4; display: none; flex-direction: column; align-items: center; pointer-events: none; text-shadow: 0 4px 24px rgba(0,0,0,.75); }
  .pop b { font-size: clamp(88px, 30vmin, 220px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .pop i { font-style: normal; font-weight: 900; font-size: 1.1rem; background: #fff; color: var(--n900); padding: 4px 16px 4px 10px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .pop.pb i { background: var(--red); color: #fff; }
  .pop.on { display: flex; animation: popin 1.6s ease-out forwards; }
  @keyframes popin { 0% { transform: scale(.6); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 22% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.96); } }
  @media (orientation: landscape) { .pop { right: var(--rc); top: 22%; } }
  /* 表示は「メーター」の1種類(2026-11-24 中山さん「モード切替は要る?1種類でよくね」)。はじめる/とめるを大きく真ん中に */
  .dock { justify-content: center; }
  .go { flex: 1; max-width: 460px; }
  .help div div { text-wrap: balance; }
  /* 今回の結果(とめたあと) */
  .sum { width: min(100%, 360px); text-align: left; }
  .sumh { display: flex; align-items: baseline; justify-content: space-between; font-size: 1.1rem; font-weight: 900; border-bottom: 2px solid #fff; padding-bottom: 6px; }
  .sumh span { font-size: .85rem; color: var(--soft); }
  .sumg { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 8px; }
  .sumg div { display: flex; flex-direction: column; padding-left: 10px; border-left: 2px solid rgba(255,255,255,.2); }
  .sumg div:first-child { border-left: 0; padding-left: 0; }
  .sumg i { font-style: normal; font-size: .85rem; color: var(--soft); }
  .sumg b { font-size: 2.4rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .sumg .r b { color: #ff5a52; }
  .sumpb { display: inline-block; margin-top: 10px; background: var(--red); font-weight: 900; padding: 4px 18px 4px 10px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .sum p { margin: 10px 0 0; font-size: .9rem; color: var(--soft); }
  .sumlink { display: inline-flex; align-items: center; min-height: 48px; margin-top: 4px; color: #fff; font-weight: 900; text-decoration: none; }
  html:not(.dev) .devonly { display: none !important; }
  .savebtn { position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 4; min-height: 52px; border-radius: 14px; border: 0; background: #fff; color: var(--n900); font-weight: 900; font-size: 1rem; display: none; cursor: pointer; }
  .flip { flex: none; min-width: 72px; min-height: 64px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,.85); background: rgba(12,22,54,.9); color: #fff; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 800; font-size: .72rem; cursor: pointer; padding: 0 8px; }
  .flip svg { width: 28px; height: 28px; } .flip s, .flip span { display: none; } .flip { min-width: 64px; }
  body.prep .go.stop { flex: none; min-width: 112px; background: transparent; box-shadow: none; border: 2px solid rgba(255,255,255,.55); color: #fff; font-size: 1rem; }
  .go { max-width: 360px; }
  @media (orientation: landscape) { .flip { min-height: 52px; min-width: 64px; } }
</style>
</head>
<body class="ui-a">
<header class="top">
  <img class="logo" src="../icons/logo-mitori-white.png" alt="MITORI">
  <span class="band" id="band" data-state="idle"><svg class="kslogo" viewBox="14 4 252 80" role="img" aria-label="ケンソク！"><g transform="skewX(-8)"><text x="22" y="70" font-family="Reggae One" font-size="54" letter-spacing="-5" fill="#fff">ケンソク</text><path d="M250 10 L260 10 L254 58 L248 58 Z" fill="#e0353b"/><circle cx="250" cy="72" r="6.5" fill="#e0353b"/></g><path d="M214 20 Q 236 8 262 12" stroke="#e0353b" stroke-width="2" fill="none" opacity=".9"/><path d="M208 30 Q 232 16 260 20" stroke="#e0353b" stroke-width="1.2" fill="none" opacity=".5"/></svg></span>
  <span class="sp"></span>
  <button class="ib" id="btnVoice" type="button" aria-label="速さを読み上げる" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <details class="set"><summary class="ib" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></summary><div class="setp">
    <h4>測り方</h4>
    <label>出す速さ <select id="which"><option value="tip">剣先</option><option value="mono">物打ち</option><option value="hand">手元(両手)</option></select></label>
    <label>道具 <select id="tool">
      <option value="101.5">木刀(形の大刀)</option><option value="120">竹刀 一般 120</option><option value="117">竹刀 高校 117</option><option value="114">竹刀 中学 114</option>
    </select></label>
    <label>竹刀の色 <select id="col"><option value="wood">木・竹</option><option value="white">白</option><option value="black">黒</option></select></label>
    <label>カメラ <select id="facing"><option value="user">インカメ(自撮り)</option><option value="environment">外カメ</option></select></label>
    <label class="devonly">骨格 <select id="pose"><option value="on">使う(1秒10回)</option><option value="off">使わない</option></select></label>
    <h4 class="devonly">試験用</h4>
    <div class="row devonly"><label class="file">動画で試す<input id="file" type="file" accept="video/*"></label></div>
    <label class="devonly">再生 <select id="rate"><option value="1">そのまま</option><option value="0.5">1/2</option><option value="0.25">1/4</option></select></label>
    <label class="devonly">重ねる <select id="dbg"><option value="off">なし</option><option value="on">道具の見つけ方</option></select></label>
    <h4>記録(この端末の中だけ)</h4>

// ---- 60コマにする ----
// 2026-11-23 実機(Pixel 9a・lab/fps60-test.html): 大きさと「60ちょうど」だけを頼むと約58コマ。露出モード・ISO・手動露出を頼むと、どれでも30コマに落ちた
// (Chrome がカメラを作り直す)。そのため露出には一切触らない。暗いとカメラが露光を延ばして15〜30コマになるので、そのときは「明るく」と案内する

// ---- 録画(2026-11-24 中山さん「録画できてる方がよさそう」): 素振りの間(準備のあと〜とめるまで)カメラの映像を端末の中に録り、とめたあとに「録画を保存」で書き出す。外には送らない ----

function statsCol(g, x, H, R, last, avg, best, n) { // 縦に3つ
  const items = [['今の1本', last ? val(last).toFixed(1) : '--'], [avgLabel(n), avg ? avg.toFixed(1) : '--'], [`最高(${n}本)`, best ? best.toFixed(1) : '--']];

// ---- 読み上げ(遠くからでも分かるように。奥さまの案 2026-11-22)。振り下ろしの1本ごとに「12.3」と言う。押すと止める ----
let voiceOn = true, spoken = new Set(), pbBest = 0, pbBase = 0, pbUntil = 0, sessionPB = false, setSaid = false;
// 自己ベストの基準: この端末の記録のうち、同じ道具・今の測り方(m あり)の最高
function loadPB() { const tool = $('tool').selectedOptions[0].textContent, k = which(), a = readLog().filter((r) => r.m && r.tool === tool); pbBase = a.length; pbBest = a.reduce((m, r) => Math.max(m, r[k] || 0), 0); }
try { voiceOn = localStorage.getItem('mitori.speedo.voice') !== '0'; } catch (e) { /* そのまま */ }
const vb = $('btnVoice'); const showVoice = () => { vb.classList.toggle('off', !voiceOn); vb.setAttribute('aria-pressed', String(voiceOn)); }; showVoice();

// 声の選び方(2026-11-24 中山さん「ゆっくりめのお姉さんボイス」): 日本語の声のうち、女性の声として知られる名前を先に選ぶ。合わなければ⚙の「声の種類」で変えられる(選んだ声は覚える)
const FEMALE = /kyoko|o-?ren|haruka|ayumi|nanami|sayaka|mizuki|female|女性|ja-jp-x-(htm|jab)/i;
let voiceName = ''; try { voiceName = localStorage.getItem('mitori.speedo.voiceName') || ''; } catch (e) { /* そのまま */ }
const jaVoices = () => { try { return speechSynthesis.getVoices().filter((x) => /^ja/i.test(x.lang)); } catch (e) { return []; } };
function pickVoice() { const L = jaVoices(); return L.find((x) => x.name === voiceName) || L.find((x) => FEMALE.test(x.name + ' ' + x.voiceURI)) || L[0] || null; }
function fillVoices() { const sel = $('voiceSel'), L = jaVoices(), cur = pickVoice(); sel.innerHTML = L.length ? L.map((x, i) => `<option value="${x.name}"${cur && cur.name === x.name ? ' selected' : ''}>${FEMALE.test(x.name + ' ' + x.voiceURI) ? '♀ ' : ''}${x.name.replace(/^Google /, '')}</option>`).join('') : '<option>(この端末の標準の声)</option>'; }

fillVoices();
$('voiceSel').onchange = () => { voiceName = $('voiceSel').value; try { localStorage.setItem('mitori.speedo.voiceName', voiceName); } catch (e) { /* そのまま */ } say('こんにちは。この声で案内しますね'); };

}
