<!DOCTYPE html>
<html lang="ja" data-lab>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- 試作: 素振りのスピードメーター(リアルタイム)。道具は毎コマ、骨格は1秒10回ほど(別の処理)。表示は3案(メーター・数字・映像)を切り替えて見比べる。
     見た目は MITORI の撮影画面にそろえる(紺・白・赤、斜めの帯、白い細い縁の丸ボタン、Murecho。中山さん 2026-11-22)。速さは読み上げもできる(遠くからでも分かるように。奥さまの案)
     映像は端末の中だけで扱い、保存も送信もしない。計測の出来事(GA4)は送らない。通常のページからリンクしない -->
<title>MITORI(試作: 素振りスピードメーター)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Murecho:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root { --n950: #070d22; --n900: #0c1636; --n800: #14224d; --n700: #1d3170; --line: rgba(255,255,255,.2); --shade: #2c4aa0; --red: #d6231b; --text: #fff; --soft: rgba(255,255,255,.62); --skew: -14deg; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--n950); color: var(--text); font-family: "Murecho", -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); overflow: hidden; }
  button, select { font-family: inherit; }
  /* 上の段: ロゴ・状態の帯・丸ボタン */
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px; }
  .top .logo { height: 22px; opacity: .9; }
  .band { display: inline-flex; align-items: center; gap: 8px; padding: 6px 22px 6px 12px; font-weight: 900; font-size: 1.05rem; line-height: 1; letter-spacing: .04em; white-space: nowrap; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); background: var(--n700); }
  .band[data-state="on"] { background: var(--red); }
  .band[data-state="on"]::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .sp { flex: 1; }
  .ib { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85); background: rgba(12,22,54,.9); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; list-style: none; }
  .ib svg { width: 24px; height: 24px; }
  .ib.off { opacity: .45; }
  details.set { position: relative; }
  details.set summary::-webkit-details-marker { display: none; }
  details.set .setp { position: absolute; z-index: 20; top: 56px; right: 0; width: min(86vw, 340px); max-height: 70vh; overflow: auto; background: var(--n900); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .setp h4 { margin: 4px 0 0; font-size: .8rem; color: var(--soft); font-weight: 800; }
  .setp label { display: grid; grid-template-columns: 6.5em 1fr; align-items: center; gap: 8px; font-size: .9rem; font-weight: 800; }
  .setp select, .setp .btn, .file { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--n800); color: #fff; font-size: .95rem; font-weight: 800; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .setp .row { display: flex; flex-wrap: wrap; gap: 8px; }
  input[type=file] { display: none; }
  #logInfo { font-size: .8rem; color: var(--soft); }
  #stat { font-size: .72rem; color: var(--soft); padding: 0 14px 4px; font-variant-numeric: tabular-nums; min-height: 1.2em; }
  /* 真ん中: 映像と表示 */
  main { flex: 1; position: relative; overflow: hidden; display: flex; min-height: 0; }
  .stage { position: relative; background: #000; }
  .stage video { display: block; width: 100%; height: 100%; object-fit: contain; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .view { flex: 1; position: relative; min-height: 0; }
  .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  body.ui-a .stage, body.ui-b .stage { width: 34%; min-width: 160px; }
  body.ui-c .stage { flex: 1; }
  body.ui-c .view { display: none; }
  @media (orientation: portrait) {
    main { flex-direction: column; }
    body.ui-a .stage, body.ui-b .stage { width: auto; height: 28%; margin: 0 12px; border-radius: 12px; overflow: hidden; }
  }
  .big { position: absolute; left: 14px; top: 12px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,.8); display: none; }
  body.ui-c .big { display: block; }
  .big .tag { display: inline-block; background: #fff; color: var(--n900); font-size: 1rem; padding: 4px 16px 4px 10px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .big .n { display: block; font-size: 96px; line-height: 1; } .big .u { font-size: 22px; margin-left: 4px; } .big .s { display: block; font-size: 15px; color: #eee; white-space: pre-line; }
  .help { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1rem; font-weight: 800; line-height: 1.8; padding: 16px; background: rgba(7,13,34,.55); }
  /* 下の段: 表示の切り替え(名前の帯)と、はじめる・とめる */
  .dock { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--n900); }
  .tabs { display: flex; gap: 6px; }
  .tabs button { position: relative; border: 0; background: transparent; color: var(--soft); font-weight: 900; font-size: 1rem; padding: 12px 14px; min-height: 48px; cursor: pointer; }
  .tabs button::before, .tabs button::after { content: ''; position: absolute; inset: 4px 0; transform: skewX(var(--skew)); z-index: -1; }
  .tabs button { z-index: 0; }
  .tabs button.on { color: var(--n900); }
  .tabs button.on::after { background: var(--shade); transform: skewX(var(--skew)) translate(4px, 4px); z-index: -2; }
  .tabs button.on::before { background: #fff; }
  .go { min-width: 120px; min-height: 64px; border-radius: 18px; border: 0; background: #fff; color: var(--n900); font-weight: 900; font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 0 var(--shade); }
  .go.stop { background: var(--red); color: #fff; box-shadow: 0 4px 0 #7a1410; }
  .go svg { width: 22px; height: 22px; }
</style>
</head>
<body class="ui-a">
<header class="top">
  <img class="logo" src="../icons/logo-mitori-white.png" alt="MITORI">
  <span class="band" id="band" data-state="idle">素振りスピード</span>
  <span class="sp"></span>
  <button class="ib" id="btnVoice" type="button" aria-label="速さを読み上げる" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <details class="set"><summary class="ib" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></summary><div class="setp">
    <h4>測り方</h4>
    <label>出す速さ <select id="which"><option value="tip">剣先</option><option value="mono">物打ち</option><option value="hand">手元(両手)</option></select></label>
    <label>道具 <select id="tool">
      <option value="101.5">木刀(形の大刀)</option><option value="120">竹刀 一般 120</option><option value="117">竹刀 高校 117</option><option value="114">竹刀 中学 114</option>
    </select></label>
    <label>色 <select id="col"><option value="wood">木・竹</option><option value="white">白</option><option value="black">黒</option></select></label>
    <label>カメラ <select id="facing"><option value="user">インカメ(自撮り)</option><option value="environment">外カメ</option></select></label>
    <label>骨格 <select id="pose"><option value="on">使う(1秒10回)</option><option value="off">使わない</option></select></label>
    <h4>試験用</h4>
    <div class="row"><label class="file">動画で試す<input id="file" type="file" accept="video/*"></label></div>
    <label>再生 <select id="rate"><option value="1">そのまま</option><option value="0.5">1/2</option><option value="0.25">1/4</option></select></label>
    <label>重ねる <select id="dbg"><option value="off">なし</option><option value="on">道具の見つけ方</option></select></label>
    <h4>記録(この端末の中だけ)</h4>
    <div class="row"><button class="btn" id="btnReset" type="button">表示をリセット</button><button class="btn" id="btnExport" type="button">書き出す(CSV)</button><button class="btn" id="btnClearLog" type="button">記録を消す</button></div>
    <span id="logInfo"></span>
  </div></details>
</header>
<div id="stat"></div>
<main>
  <div class="stage" id="stage">
    <video id="v" playsinline muted></video>
    <canvas id="ov"></canvas>
    <div class="big" id="big"><span class="tag" id="bigTag">剣先</span><span class="n" id="bigN">--</span><span class="s" id="bigS"></span></div>
    <div class="help" id="help">真横から、全身と剣先が入るように置いて、<br>「はじめる」を押してください</div>
  </div>
  <div class="view"><canvas id="gauge"></canvas></div>
</main>
<footer class="dock">
  <div class="tabs"><button data-ui="a" class="on" type="button">メーター</button><button data-ui="b" type="button">数字</button><button data-ui="c" type="button">映像</button></div>
  <button class="go" id="btnCam" type="button">はじめる</button>
</footer>
<script type="module">
import { SwingEngine } from './js/swing-engine.js';
const $ = (id) => document.getElementById(id);
const v = $('v'), ov = $('ov'), oc = ov.getContext('2d'), gauge = $('gauge'), gc = gauge.getContext('2d'), stat = $('stat');
const eng = new SwingEngine({ lengthCm: 101.5, color: 'wood', width: 320 });
let ui = 'a', running = false, isFile = false, frames = 0, procMs = 0, display = 0, lastT = null, poseFps = 0;

// ---- 設定 ----
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  ui = b.dataset.ui; document.body.className = 'ui-' + ui;
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b)); resize();
});
$('tool').onchange = () => eng.setLength(parseFloat($('tool').value));
$('col').onchange = () => eng.setColor($('col').value);
$('facing').onchange = () => { if (!isFile && v.srcObject) openCamera(); }; // 開いているときは、すぐ切り替える
$('pose').onchange = () => { eng.needPerson = $('pose').value === 'on'; };
$('rate').onchange = () => { v.playbackRate = parseFloat($('rate').value); };
$('btnReset').onclick = () => { eng.swings = []; eng.signStats = { 1: [], '-1': [] }; }; // 画面の表示だけ。保存した記録は消さない
function resize() {
  for (const c of [ov, gauge]) { const r = c.getBoundingClientRect(); c.width = Math.max(1, Math.round(r.width * devicePixelRatio)); c.height = Math.max(1, Math.round(r.height * devicePixelRatio)); }
}
addEventListener('resize', resize);

// ---- 骨格(別の処理)。1秒10回まで。前の結果のまわりを切り出して読む ----
const pcv = document.createElement('canvas'), pcx = pcv.getContext('2d'); let poseScale = 1;
let worker = null, poseBusy = false, poseLast = 0, prevBox = null, poseN = 0, poseT0 = performance.now();
function startWorker() {
  if (worker) return;
  try { worker = new Worker('./js/pose-worker.js'); } catch (e) { worker = null; return; }
  worker.onmessage = (ev) => {
    const d = ev.data; if (d.ready || d.error) { if (d.error) stat.textContent = '骨格の読み込みに失敗(道具だけで測ります)'; return; }
    poseBusy = false; poseN++;
    if (d.kp) { eng.addPose(d.t, d.kp, pcv.width); prevBox = d.box; } else prevBox = null; // 座標は縮めた画像のもの
  };
}
async function maybePose(t) {
  if ($('pose').value !== 'on' || !worker || poseBusy) return;
  const now = performance.now(); if (now - poseLast < 100) return;
  poseBusy = true; poseLast = now;
  // 骨格には、縮めた画像(長い辺480)を送る(元の大きさのまま送ると重く、1秒2回しか回らなかった)
  const VW0 = v.videoWidth, VH0 = v.videoHeight, ps = Math.min(1, 480 / Math.max(VW0, VH0));
  if (pcv.width !== Math.round(VW0 * ps)) { pcv.width = Math.round(VW0 * ps); pcv.height = Math.round(VH0 * ps); }
  pcx.drawImage(v, 0, 0, pcv.width, pcv.height); poseScale = ps;
  let crop = null;
  if (prevBox) { const VW = pcv.width, VH = pcv.height, bw = prevBox[2] - prevBox[0], bh = prevBox[3] - prevBox[1], cx = (prevBox[0] + prevBox[2]) / 2, w2 = Math.max(bw * 2, bh * 1.2), y0 = Math.max(0, prevBox[1] - bh * 0.6), y1 = Math.min(VH, prevBox[3] + bh * 0.15), x0 = Math.max(0, cx - w2 / 2); crop = [x0, y0, Math.min(VW, cx + w2 / 2) - x0, y1 - y0]; }
  try { const bm = await createImageBitmap(pcv); worker.postMessage({ bitmap: bm, t, crop }, [bm]); } catch (e) { poseBusy = false; }
}

// ---- 入力 ----
let stopped = false;
function stopAll() { // とめる: カメラを閉じ、計測を止める(記録はそのまま)
  stopped = true; running = false;
  if (v.srcObject) { v.srcObject.getTracks().forEach((tr) => tr.stop()); v.srcObject = null; }
  if (isFile) v.pause();
  camTrack = null; setGo(false); $('help').style.display = 'flex'; $('help').innerHTML = '真横から、全身と剣先が入るように置いて、<br>「はじめる」を押してください';
}
function setGo(on) { const b = $('btnCam'); b.textContent = on ? 'とめる' : 'はじめる'; b.classList.toggle('stop', on); $('band').dataset.state = on ? 'on' : 'idle'; $('band').textContent = on ? '計測中' : '素振りスピード'; }
$('btnCam').onclick = () => { if (running) stopAll(); else openCamera(); };
async function openCamera() {
  try {
    voiceUnlock();
    if (v.srcObject) v.srcObject.getTracks().forEach((tr) => tr.stop());
    // まず高い画質(1280×720)で60コマを頼み、60が出なければ640×480に下げる(中山さん 2026-11-22「Bで」)。測るのは小さい画像なので、速さの精度は変わらない
    const st = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: $('facing').value }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } } });
    isFile = false; v.srcObject = st; v.removeAttribute('src'); await v.play(); begin();
    tuneCamera(st.getVideoTracks()[0]);
  } catch (e) { stat.textContent = 'カメラを開けません: ' + e.message; }
}
$('file').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  isFile = true; v.srcObject = null; v.src = URL.createObjectURL(f); v.loop = false; v.playbackRate = parseFloat($('rate').value);
  v.onloadedmetadata = () => { v.play(); begin(); $('rate').closest('details') && ($('rate').closest('details').open = false); };
};
// ---- 60コマにする(本体の「なめらか」と同じ考え。js/smooth60.js) ----
// 何も指定しないと、Pixel 9a はふつうの部屋で約20コマ(露出が長くなる)。①60ちょうどを頼む ②露出モード continuous を、大きさの頼みのあとで足す
// (Chrome は露出の指定が入った頼みでは大きさ・コマ数を変えない) ③それでも50コマを切るなら、ISO(感度)を段々上げる(明るさを保って露出を短くする。映像はざらつく)
const ISO_STEPS = [0, 400, 800, 1600, 3200];
const TIERS = [[1280, 720], [640, 480]]; // 画質の段。60コマが出ないときは下の段へ
let camTrack = null, camBase = null, isoLevel = 0, lowSec = 0, camFps = 0, lastPresented = null, tier = 0;
async function tuneCamera(tr, startTier = 0) {
  camTrack = tr; isoLevel = 0; lowSec = 0; tier = startTier;
  for (; tier < TIERS.length; tier++) { // 60ちょうどを頼める段を上から探す
    const base = { width: { ideal: TIERS[tier][0] }, height: { ideal: TIERS[tier][1] } };
    try { await tr.applyConstraints({ ...base, frameRate: { exact: 60 } }); camBase = { ...base, frameRate: { exact: 60 } }; break; } catch (e) { /* 次の段 */ }
  }
  if (tier >= TIERS.length) { // どの段でも60ちょうどは断られた: 頼んだ段の画質で「できれば60」。実際のコマ数を見て、下げるかを決める
    tier = startTier; camBase = { width: { ideal: TIERS[tier][0] }, height: { ideal: TIERS[tier][1] }, frameRate: { ideal: 60 } };
    try { await tr.applyConstraints(camBase); } catch (e) { /* そのまま */ }
  }
  await applyExposure();
}
async function applyExposure() {
  const tr = camTrack; if (!tr || tr.readyState !== 'live') return;
  const caps = tr.getCapabilities ? tr.getCapabilities() : {}, adv = {};
  if (caps.exposureMode && caps.exposureMode.includes('continuous')) adv.exposureMode = 'continuous';
  if (isoLevel > 0 && caps.iso && caps.iso.max) adv.iso = Math.max(caps.iso.min, Math.min(caps.iso.max, ISO_STEPS[isoLevel]));
  if (!Object.keys(adv).length) return;
  try { await tr.applyConstraints({ ...camBase, advanced: [adv] }); } catch (e) { /* 対応しない端末(iPhone など)は、そのまま */ }
}
function checkCamFps() { // 1秒ごと。カメラのコマ数が50を切るのが2秒続いたら、ISOを1段上げる
  if (!camTrack || isFile) return;
  // 50コマを切るのが3秒続いたら、まず画質の段を下げる(高い画質では60が出ないカメラが多い。インカメなど)
  if (camFps > 0 && camFps < 50 && tier < TIERS.length - 1) { if (++lowSec >= 3) { lowSec = 0; tuneCamera(camTrack, tier + 1); } return; }
  const caps = camTrack.getCapabilities ? camTrack.getCapabilities() : {};
  if (!caps.iso || (caps.frameRate && caps.frameRate.max < 50)) return; // ISOを変えられない・そもそも60コマが出ないカメラでは、上げても意味がない(ざらつくだけ)
  if (camFps > 0 && camFps < 50) { if (++lowSec >= 2 && isoLevel < ISO_STEPS.length - 1) { isoLevel++; lowSec = 0; applyExposure(); } } else lowSec = 0;
}

function begin() {
  stopped = false; setGo(true);
  $('help').style.display = 'none'; eng.reset(); logged = new Set(); spoken = new Set(); eng.needPerson = $('pose').value === 'on'; startWorker(); resize();
  if (!running) { running = true; v.requestVideoFrameCallback(onFrame); }
}

// ---- 1コマごと ----
function onFrame(now, md) {
  const t = md.mediaTime, t0 = performance.now();
  if (lastT == null || t > lastT) { eng.process(v, t, { keepDebug: $('dbg').value === 'on' }); lastT = t; maybePose(t); }
  if (lastT != null && t < lastT - 0.5) { eng.reset(); lastT = t; } // 動画を巻き戻したとき
  procMs = procMs * 0.9 + (performance.now() - t0) * 0.1; frames++;
  if (lastPresented == null) lastPresented = md.presentedFrames; presentedNow = md.presentedFrames;
  draw();
  if (!v.ended && !stopped) v.requestVideoFrameCallback(onFrame); else { running = false; if (v.ended) setGo(false); }
}
let presentedNow = 0, visPct = 100;
setInterval(() => {
  camFps = lastPresented == null ? 0 : presentedNow - lastPresented; lastPresented = presentedNow; checkCamFps();
  const el = (performance.now() - poseT0) / 1000; poseFps = poseN / el; poseN = 0; poseT0 = performance.now();
  const st = camTrack && camTrack.getSettings ? camTrack.getSettings() : {};
  const vis = eng.allN ? Math.round(eng.seenN / eng.allN * 100) : 0; eng.seenN = 0; eng.allN = 0; visPct = vis;
  stat.textContent = `道具が見えた ${vis}% ・ カメラ ${camFps}コマ/秒${isFile ? '' : `(${st.width || '?'}×${st.height || '?'}${isoLevel ? ` ISO${ISO_STEPS[isoLevel]}` : ''})`} ・ 測った ${frames}コマ/秒 ・ 処理 ${procMs.toFixed(1)}ms ・ 骨格 ${poseFps.toFixed(1)}回/秒 ・ 長さ ${eng.lenPx ? Math.round(eng.lenPx) + '画素' : '測定中'}`;
  frames = 0;
}, 1000);

// ---- 表示 ----
const downs = () => eng.swings.filter((s) => eng.isDown(s));
// 出す速さ(剣先・物打ち・手元)。1本の記録 s は、剣先 v・物打ち mono・手元 hand を持つ
const WHICH = { tip: '剣先', mono: '物打ち', hand: '手元' };
const which = () => $('which').value;
const val = (s) => (which() === 'tip' ? s.v : s[which()]) || 0;
const cur = () => (eng.speeds ? eng.speeds[which()] : eng.speed) || 0;
const three = (s) => s ? `剣先 ${s.v.toFixed(1)} ・ 物打ち ${(s.mono || 0).toFixed(1)} ・ 手元 ${(s.hand || 0).toFixed(1)}` : '';
// 速さの色: 遅い=白 → 速い=赤(MITORIの赤 #d6231b)
function colorOf(sp) { const u = Math.max(0, Math.min(1, (sp - 4) / 12)); return `rgb(${Math.round(255 - 41 * u)},${Math.round(255 - 220 * u)},${Math.round(255 - 228 * u)})`; }
const FONT = '"Murecho", system-ui, sans-serif';
function draw() {
  // 針: 上がるときはすぐ、下がるときはゆっくり
  const cv = cur(); display = cv > display ? cv : Math.max(cv, display - 0.25);
  const D = downs(), last = D[D.length - 1], recent = D.slice(-10), avg = recent.length ? recent.reduce((a, s) => a + val(s), 0) / recent.length : 0, best = D.reduce((m, s) => Math.max(m, val(s)), 0);
  drawOverlay();
  const noPerson = eng.needPerson && eng.H && lastT != null && !eng.personSeen(lastT);
  // 人はいるのに道具がほとんど見えない: 正面から撮っている(道具がカメラの方を向いて短く見える)か、暗い・道具の色が合っていない
  const hint = eng.shaky ? 'スマホを固定してください' : noPerson ? '全身が映るように置いてください' : (running && !isFile && visPct < 25 ? '道具が見えにくいです。真横から撮る・明るくする・設定の「色」を合わせる' : '');
  const hp = $('help'); if (hint) { hp.style.display = 'flex'; hp.textContent = hint; } else if (running) hp.style.display = 'none';
  speakNew();
  $('bigTag').textContent = WHICH[which()];
  if (ui === 'a') drawGauge(last, avg, best, D.length);
  else if (ui === 'b') drawBars(last, avg, best, D);
  else { $('bigN').innerHTML = (last ? val(last).toFixed(1) : '--') + '<span class="u">m/秒</span>'; $('bigS').textContent = `平均 ${avg.toFixed(1)} ・ 最高 ${best.toFixed(1)}(${D.length}本)\n${three(last)}`; }
}
function vidRect() { // 映像が実際に映っている場所(object-fit: contain)
  const W = ov.width, H = ov.height, ar = (v.videoWidth || 16) / (v.videoHeight || 9); let w = W, h = W / ar; if (h > H) { h = H; w = H * ar; }
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}
function drawOverlay() {
  oc.clearRect(0, 0, ov.width, ov.height); if (!eng.H) return;
  const r = vidRect(), k = r.w / eng.W, P = (p) => [r.x + p[0] * k, r.y + p[1] * k];
  if ($('dbg').value === 'on' && eng.debug && eng.debug.mask) {
    const d = eng.debug; oc.fillStyle = 'rgba(0,255,90,.55)';
    for (let i = 0; i < d.mask.length; i += 1) if (d.mask[i]) oc.fillRect(r.x + (i % d.W) * k, r.y + ((i / d.W) | 0) * k, k, k);
    if (d.hand) { const h = P(d.hand); oc.fillStyle = '#4dc3ff'; oc.beginPath(); oc.arc(h[0], h[1], 8, 0, 7); oc.fill(); }
  }
  // 剣先の軌跡(0.5秒ぶん)。色は速さ
  const S = eng.samples, tEnd = S.length ? S[S.length - 1].t : 0; let prev = null, prevT = null;
  oc.lineWidth = Math.max(3, ov.width / 200); oc.lineCap = 'round';
  for (const s of S) {
    if (!s.tip || tEnd - s.t > 0.5) { prev = null; continue; }
    const p = P(s.tip);
    if (prev && Math.hypot(s.tip[0] - prev[0], s.tip[1] - prev[1]) > eng.W * 0.25) prev = null; // 大きく飛んだら線をつながない
    if (prev) { const sp = Math.hypot(s.tip[0] - prev[0], s.tip[1] - prev[1]) / Math.max(1e-3, s.t - prevT) * (eng.lenPx ? eng.effM / eng.lenPx : 0); const q = P(prev); oc.strokeStyle = colorOf(sp); oc.globalAlpha = 1 - (tEnd - s.t) / 0.5; oc.beginPath(); oc.moveTo(q[0], q[1]); oc.lineTo(p[0], p[1]); oc.stroke(); }
    prev = s.tip; prevT = s.t;
  }
  oc.globalAlpha = 1;
}
function drawGauge(last, avg, best, n) {
  const W = gauge.width, H = gauge.height, g = gc; g.clearRect(0, 0, W, H);
  const R = Math.min(W * 0.38, H * 0.40), cx = W / 2, cy = H * 0.46, MAX = 20, a0 = Math.PI * 0.8, a1 = Math.PI * 2.2, A = (s) => a0 + (a1 - a0) * Math.min(1, s / MAX);
  g.lineCap = 'butt'; g.lineWidth = R * 0.13;
  g.strokeStyle = '#1d3170'; g.beginPath(); g.arc(cx, cy, R, a0, a1); g.stroke();                       // 地: 紺
  g.strokeStyle = colorOf(display); g.beginPath(); g.arc(cx, cy, R, a0, A(display)); g.stroke();      // いま: 白→赤
  g.fillStyle = 'rgba(255,255,255,.6)'; g.font = `800 ${R * 0.1}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let s = 0; s <= MAX; s += 5) { const a = A(s); g.fillText(s, cx + Math.cos(a) * R * 1.2, cy + Math.sin(a) * R * 1.2); }
  if (best) { const a = A(best); g.strokeStyle = '#d6231b'; g.lineWidth = Math.max(4, R * 0.035); g.beginPath(); g.moveTo(cx + Math.cos(a) * R * 0.84, cy + Math.sin(a) * R * 0.84); g.lineTo(cx + Math.cos(a) * R * 1.1, cy + Math.sin(a) * R * 1.1); g.stroke(); }
  const an = A(display); g.strokeStyle = '#fff'; g.lineWidth = Math.max(4, R * 0.035); g.lineCap = 'round'; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(an) * R * 0.92, cy + Math.sin(an) * R * 0.92); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(cx, cy, R * 0.06, 0, 7); g.fill();
  bigReadout(g, cx, cy + R * 0.62, R * 0.5, last, avg, best, n);
}
// 今の1本の数字(大きく)と、斜めの札「剣先」、その下に平均・最高と3か所の速さ
function bigReadout(g, cx, y, size, last, avg, best, n) {
  const W = gauge.width, tag = WHICH[which()];
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = `900 ${size * 0.36}px ${FONT}`; const tw = g.measureText(tag).width + size * 0.4, th = size * 0.5, tx = cx - tw / 2, ty = y - size * 1.05;
  g.save(); g.fillStyle = '#2c4aa0'; g.transform(1, 0, -0.25, 1, ty * 0.25 + 4, 4); g.fillRect(tx, ty, tw, th); g.restore();
  g.save(); g.fillStyle = '#fff'; g.transform(1, 0, -0.25, 1, ty * 0.25, 0); g.fillRect(tx, ty, tw, th); g.restore();
  g.fillStyle = '#0c1636'; g.fillText(tag, cx, ty + th * 0.75);
  g.fillStyle = last ? colorOf(val(last)) : '#fff'; g.font = `900 ${size}px ${FONT}`; g.fillText(last ? val(last).toFixed(1) : '--', cx, y + size * 0.15);
  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = `800 ${Math.max(12, size * 0.2)}px ${FONT}`; g.fillText(`m/秒 ・ 平均 ${avg.toFixed(1)} ・ 最高 ${best.toFixed(1)}(${n}本)`, cx, y + size * 0.48);
  if (last) { g.font = `500 ${Math.max(11, size * 0.17)}px ${FONT}`; g.fillText(three(last), cx, y + size * 0.74); }
}
function drawBars(last, avg, best, D) {
  const W = gauge.width, H = gauge.height, g = gc; g.clearRect(0, 0, W, H);
  bigReadout(g, W / 2, H * 0.42, Math.min(W * 0.26, H * 0.3), last, avg, best, D.length);
  const B = D.slice(-12), x0 = W * 0.06, x1 = W * 0.94, y0 = H * 0.66, y1 = H * 0.95, MAX = Math.max(16, best * 1.1), bw = (x1 - x0) / 12;
  g.strokeStyle = 'rgba(255,255,255,.2)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x0, y1); g.lineTo(x1, y1); g.stroke();
  g.textAlign = 'center';
  B.forEach((s, i) => { const vv = val(s), h = (y1 - y0) * vv / MAX, isLast = i === B.length - 1; g.fillStyle = isLast ? colorOf(vv) : '#2c4aa0'; g.fillRect(x0 + i * bw + bw * 0.15, y1 - h, bw * 0.7, h); g.fillStyle = 'rgba(255,255,255,.8)'; g.font = `800 ${bw * 0.28}px ${FONT}`; g.fillText(vv.toFixed(1), x0 + i * bw + bw / 2, y1 - h - 6); });
  if (avg) { const y = y1 - (y1 - y0) * avg / MAX; g.strokeStyle = '#fff'; g.setLineDash([6, 6]); g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke(); g.setLineDash([]); }
}
// ---- 読み上げ(遠くからでも分かるように。奥さまの案 2026-11-22)。振り下ろしの1本ごとに「12.3」と言う。押すと止める ----
let voiceOn = true, spoken = new Set();
try { voiceOn = localStorage.getItem('mitori.speedo.voice') !== '0'; } catch (e) { /* そのまま */ }
const vb = $('btnVoice'); const showVoice = () => { vb.classList.toggle('off', !voiceOn); vb.setAttribute('aria-pressed', String(voiceOn)); }; showVoice();
vb.onclick = () => { voiceOn = !voiceOn; try { localStorage.setItem('mitori.speedo.voice', voiceOn ? '1' : '0'); } catch (e) { /* そのまま */ } showVoice(); if (!voiceOn) speechSynthesis.cancel(); else say('読み上げます'); };
function voiceUnlock() { try { if (voiceOn) speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) { /* 読み上げに対応しない端末 */ } } // 押した操作の中で一度呼ぶ(端末によっては、これがないと話さない)
function say(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 1.15; speechSynthesis.speak(u); } catch (e) { /* そのまま */ }
}
function speakNew() {
  const D = downs(); const s = D[D.length - 1]; if (!s || spoken.has(s)) return;
  spoken.add(s); if (performance.now() - (s.at || 0) > 3000 && s.at) return; say(val(s).toFixed(1));
}

// ---- 記録(端末の中だけ。localStorage)。振り下ろしの1本ごとに、日時・道具・剣先・物打ち・手元を残す。書き出しはCSV ----
const LOG_KEY = 'mitori.speedo.log';
const readLog = () => { try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch (e) { return []; } };
const writeLog = (a) => { try { localStorage.setItem(LOG_KEY, JSON.stringify(a.slice(-5000))); } catch (e) { /* 残せなくても測るのは続ける */ } };
const showLogInfo = () => { $('logInfo').textContent = `保存した記録 ${readLog().length}本`; };
let logged = new Set();
function saveDowns() { // 振り下ろしと分かったものだけ(向きの判定が後で変わることがあるので、表示のたびに見直して足す)
  if (isFile) return; const D = downs(), add = D.filter((s) => !logged.has(s)); if (!add.length) return;
  const a = readLog(), tool = $('tool').selectedOptions[0].textContent;
  for (const s of add) { logged.add(s); a.push({ at: new Date().toISOString(), tool, tip: +s.v.toFixed(2), mono: +(s.mono || 0).toFixed(2), hand: +(s.hand || 0).toFixed(2) }); }
  writeLog(a); showLogInfo();
}
setInterval(saveDowns, 1000);
$('btnExport').onclick = () => {
  const a = readLog(); if (!a.length) { $('logInfo').textContent = 'まだ記録がありません'; return; }
  const csv = '日時,道具,剣先(m/秒),物打ち(m/秒),手元(m/秒)\n' + a.map((r) => [new Date(r.at).toLocaleString(), r.tool, r.tip, r.mono, r.hand].join(',')).join('\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })), el = document.createElement('a');
  el.href = url; el.download = `mitori-suburi-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
};
let clearArm = 0;
$('btnClearLog').onclick = () => { // 2回押しで消す(1回目は知らせるだけ)
  if (Date.now() - clearArm > 3000) { clearArm = Date.now(); $('logInfo').textContent = 'もう一度押すと、保存した記録を消します'; return; }
  writeLog([]); logged = new Set(eng.swings); clearArm = 0; showLogInfo();
};
showLogInfo();
// 試験用(中身の確認)
window.__speedo = { eng, downs };
resize();
</script>
